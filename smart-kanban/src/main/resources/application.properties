spring.application.name=smart-kanban
server.port=8080

# ---------- Banco de dados (SQLite em arquivo) ----------
spring.datasource.url=jdbc:sqlite:smartkanban.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita apenas um escritor por vez: uma única conexão evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# "update" cria as tabelas na primeira execução e preserva os dados nas seguintes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Inteligência Artificial (Google Gemini) ----------
# A chave NUNCA fica no código: vem da variável de ambiente GEMINI_API_KEY
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.timeout-seconds=30
